name: Generate Gallery Data

on:
  push:
    paths:
      - 'media/**' # Triggers when changes occur inside the media folder
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC (adjust time as needed)
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: gallery-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows committing back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full commit history for proper rebasing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Eliminates Node 20 deprecation warning

      - name: Run Gallery Generator
        run: node generate-gallery.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gallery-data.js
          
          if git diff --staged --quiet; then
            echo "No changes in gallery-data.js to commit."
          else
            git commit -m "auto: update gallery-data.js with new images [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
