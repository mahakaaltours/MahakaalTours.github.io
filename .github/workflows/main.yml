name: Scheduled Review Update

on:
  schedule:
    - cron: '5 20 * * */2' # Runs alternate day at 20:05
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install google-search-results-nodejs dotenv

      # PASS SERPAPI_KEY FROM GITHUB SECRETS TO THE PYTHON SCRIPT
      - name: Execute Review Update Script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python run_reviews_update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]'
          git add reviews.json
          
          if git diff --staged --quiet; then
            echo "No changes in reviews.json to commit."
          else
            git commit -m "chore: auto-update reviews.json [skip ci]"
            git push
          fi
