<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Mahakaal 🔱 Tours & Bike Rental</title>
    <link rel="icon" href="fav.png" type="image/png">

    <!-- Immediate Theme Check -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-theme');
            } else {
                document.documentElement.classList.remove('light-theme');
            }
        })();
    </script>
    <script src="gallery-data.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/all.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="styles.css">

    <!-- Custom & Critical CSS -->
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
        }

        /* Fixed High Z-Index for Navbar so cards never obscure buttons */
        #gallery-nav {
            background-color: rgba(15, 23, 42, 0.95);
            border-color: rgba(51, 65, 85, 0.5);
            z-index: 100 !important;
        }

        #video-overlay {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.90));
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Category Container Glow Blur Effect */
        #categoryContainer {
            scroll-padding: 0.5rem;
            -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
            mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
        }

        /* Category Pills */
        .category-btn {
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .category-btn.active {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .category-btn:not(.active) {
            background-color: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .category-btn:not(.active):hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Responsive 3D Coverflow Stage Heights */
        .coverflow-stage {
            perspective: 1200px;
            position: relative;
            height: 310px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }

        @media (min-width: 640px) {
            .coverflow-stage {
                height: 440px;
                overflow: visible;
            }
        }

        @media (min-width: 1024px) {
            .coverflow-stage {
                height: 520px;
            }
        }

        /* Card Dimensions */
        .coverflow-card {
            position: absolute;
            width: 210px;
            height: 280px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            user-select: none;
        }

        @media (min-width: 640px) {
            .coverflow-card {
                width: 300px;
                height: 400px;
            }
        }

        @media (min-width: 768px) {
            .coverflow-card {
                width: 360px;
                height: 480px;
            }
        }

        .coverflow-inner {
            width: 100%;
            height: 100%;
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.125);
        }

        .coverflow-card .card-overlay {
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .coverflow-card:hover .card-overlay {
            opacity: 1;
        }

        /* Light Theme Styles */
        .light-theme body {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .light-theme #gallery-nav {
            background-color: rgba(255, 255, 255, 0.95);
            border-color: rgba(203, 213, 225, 0.8);
        }

        .light-theme #video-overlay {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.40), rgba(241, 245, 249, 0.20), rgba(255, 255, 255, 0.50));
        }

        .light-theme h2,
        .light-theme .gallery-title {
            color: #0f172a !important;
        }

        .light-theme .gallery-subtitle {
            color: #334155 !important;
        }

        .light-theme #themeToggle {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
        }

        .light-theme .category-btn.active {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .light-theme .category-btn:not(.active) {
            background-color: #ffffff;
            color: #475569;
            border-color: #cbd5e1;
        }

        .light-theme .category-btn:not(.active):hover {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #94a3b8;
        }

        /* Control Buttons */
        .nav-circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: all 0.25s ease;
        }

        @media (min-width: 640px) {
            .nav-circle-btn {
                width: 52px;
                height: 52px;
            }
        }

        .nav-circle-btn:hover {
            background: rgba(16, 185, 129, 0.9);
            border-color: #10b981;
            transform: scale(1.08);
        }

        .light-theme .nav-circle-btn {
            border-color: #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
        }

        .light-theme .nav-circle-btn:hover {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        /* Lightbox Styling */
        #lightbox {
            z-index: 200 !important;
        }

        #lightboxImg {
            max-height: 72vh;
            max-width: 92vw;
            object-fit: contain;
        }

        @media (min-width: 640px) {
            #lightboxImg {
                max-height: 82vh;
                max-width: 85vw;
            }
        }
    </style>
</head>

    <!-- Main JavaScript Logic -->
    <script>
        // --- Theme Toggle Logic ---
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function updateThemeUI() {
            const isLight = document.documentElement.classList.contains('light-theme');
            if (themeIcon) {
                themeIcon.className = isLight ? 'fas fa-moon text-xs sm:text-sm text-indigo-400' : 'fas fa-sun text-xs sm:text-sm text-yellow-400';
            }
        }
        updateThemeUI();

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('light-theme');
                const isLight = document.documentElement.classList.contains('light-theme');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                updateThemeUI();
            });
        }

        // --- District Mapping ---
        const districtKeywords = {
            "Almora": ["almora"],
            "Nainital": ["nainital", "naini"],
            "Bhimtal": ["bhimtal"],
            "Mukteshwar": ["mukteshwar"],
            "Ranikhet": ["ranikhet"],
            "Pithoragarh": ["pithoragarh", "birthi"],
            "Dehradun": ["dehradun", "doon", "mussoorie"],
            "Haridwar": ["haridwar"],
            "Chamoli": ["chamoli", "badrinath", "auli", "hemkund"],
            "Pauri Garhwal": ["pauri", "lansdowne"],
            "Tehri Garhwal": ["tehri"],
            "Rudraprayag": ["rudraprayag", "kedarnath"],
            "Uttarkashi": ["uttarkashi", "gangotri"],
            "US Nagar": ["pantnagar", "rudrapur"],
            "Bageshwar": ["bageshwar", "kausani"],
            "Champawat": ["champawat", "lohaghat"]
        };

        function getCategory(filename) {
            const lowerName = filename.toLowerCase();
            for (const [district, keywords] of Object.entries(districtKeywords)) {
                if (keywords.some(keyword => lowerName.includes(keyword))) {
                    return district;
                }
            }
            return "Others";
        }

        const categories = [
            "All", "Almora", "Nainital", "Bhimtal", "Mukteshwar",
            "Ranikhet", "Pithoragarh", "Dehradun", "Haridwar",
            "Chamoli", "Pauri Garhwal", "Tehri Garhwal", "Rudraprayag",
            "Uttarkashi", "Bageshwar", "Champawat", "US Nagar", "Others"
        ];

        let currentCategory = "All";
        let filteredImages = [];
        let activeIndex = 0;

        const coverflowStage = document.getElementById('coverflowStage');
        const categoryContainer = document.getElementById('categoryContainer');
        const prevCardBtn = document.getElementById('prevCardBtn');
        const nextCardBtn = document.getElementById('nextCardBtn');
        const carouselCounter = document.getElementById('carouselCounter');

        // Lightbox Elements
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');
        const modalPrevBtn = document.getElementById('modalPrevBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');
        const modalPrevBtnMobile = document.getElementById('modalPrevBtnMobile');
        const modalNextBtnMobile = document.getElementById('modalNextBtnMobile');
        const imageCounter = document.getElementById('imageCounter');

        // --- Render Category Pills ---
        function renderCategories() {
            categoryContainer.innerHTML = '';

            categories.forEach(cat => {
                const hasImages = cat === "All" || images.some(img => getCategory(img) === cat);
                if (!hasImages) return;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = `category-btn px-3.5 sm:px-6 py-1 sm:py-2 rounded-full border text-xs sm:text-sm font-medium transition-all duration-300 ${cat === currentCategory ? 'active' : ''}`;
                button.textContent = cat;

                button.addEventListener('click', () => {
                    currentCategory = cat;
                    activeIndex = 0;
                    renderCategories();
                    initCoverflow();
                });

                categoryContainer.appendChild(button);
            });
        }

        // --- 3D Coverflow Rendering & Mathematics ---
        function initCoverflow() {
            coverflowStage.innerHTML = '';
            activeIndex = 0; // Explicitly ensure starting index is 0

            filteredImages = currentCategory === "All"
                ? images
                : images.filter(img => getCategory(img) === currentCategory);

            if (filteredImages.length === 0) {
                coverflowStage.innerHTML = `<div class="text-center py-12 text-gray-400 font-medium text-xs sm:text-sm">No photos found in ${currentCategory} yet.</div>`;
                carouselCounter.textContent = `0 / 0`;
                return;
            }

            filteredImages.forEach((img, idx) => {
                const card = document.createElement('div');
                card.className = 'coverflow-card';

                const inner = document.createElement('div');
                inner.className = 'coverflow-inner';

                const imageEl = document.createElement('img');
                imageEl.src = `media/${img}`;
                imageEl.alt = `Gallery Image - ${getCategory(img)}`;
                imageEl.className = 'w-full h-full object-cover pointer-events-none block';
                imageEl.loading = "lazy";

                const overlay = document.createElement('div');
                overlay.className = 'card-overlay absolute inset-0 bg-black/30 flex items-center justify-center';
                overlay.innerHTML = '<div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-black/50 border border-white/40 text-white flex items-center justify-center shadow-xl"><i class="fas fa-expand-alt text-base sm:text-2xl"></i></div>';

                inner.appendChild(imageEl);
                inner.appendChild(overlay);
                card.appendChild(inner);

                card.addEventListener('click', () => {
                    if (idx === activeIndex) {
                        openLightbox(idx);
                    } else {
                        activeIndex = idx;
                        updateCoverflowPosition();
                    }
                });

                coverflowStage.appendChild(card);
            });

            updateCoverflowPosition();
            startAutoplay();
        }

        function updateCoverflowPosition() {
            const cards = Array.from(coverflowStage.children);
            if (!cards.length) return;

            const isMobile = window.innerWidth < 640;
            const xOffset = isMobile ? 95 : 220;

            cards.forEach((card, idx) => {
                const offset = idx - activeIndex;
                const absOffset = Math.abs(offset);

                if (absOffset > 3) {
                    card.style.opacity = '0';
                    card.style.pointerEvents = 'none';
                    card.style.transform = `translateX(${offset * xOffset}px) scale(0.6) rotateY(0deg)`;
                    card.style.zIndex = '0';
                    return;
                }

                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';

                if (offset === 0) {
                    card.style.transform = `translateX(0px) scale(${isMobile ? 1.02 : 1.15}) rotateY(0deg)`;
                    card.style.zIndex = '25';
                    card.style.filter = 'brightness(100%)';
                    card.style.boxShadow = '0 25px 50px rgba(0,0,0,0.7)';
                } else if (offset < 0) {
                    const rotate = Math.min(25 * absOffset, 45);
                    card.style.transform = `translateX(${offset * xOffset}px) scale(${1 - absOffset * 0.15}) translateZ(${-absOffset * 80}px) rotateY(${rotate}deg)`;
                    card.style.zIndex = `${20 - absOffset}`;
                    card.style.filter = `brightness(${100 - absOffset * 25}%)`;
                    card.style.boxShadow = '';
                } else {
                    const rotate = -Math.min(25 * absOffset, 45);
                    card.style.transform = `translateX(${offset * xOffset}px) scale(${1 - absOffset * 0.15}) translateZ(${-absOffset * 80}px) rotateY(${rotate}deg)`;
                    card.style.zIndex = `${20 - absOffset}`;
                    card.style.filter = `brightness(${100 - absOffset * 25}%)`;
                    card.style.boxShadow = '';
                }
            });

            carouselCounter.textContent = `${activeIndex + 1} / ${filteredImages.length}`;
        }

        // --- Autoplay Logic ---
        const AUTOPLAY_DELAY = 3500;
        const RESUME_AFTER = 5000;

        let autoplayTimer = null;
        let resumeTimer = null;
        let autoplayPaused = false;

        const progressBar = document.getElementById('autoplayProgress');

        function startAutoplay() {
            stopAutoplay();
            autoplayPaused = false;
            if (filteredImages.length < 2) return;

            if (progressBar) {
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                progressBar.offsetWidth;
                progressBar.style.transition = `width ${AUTOPLAY_DELAY}ms linear`;
                progressBar.style.width = '100%';
            }

            autoplayTimer = setInterval(() => {
                if (!autoplayPaused) {
                    activeIndex = (activeIndex + 1) % filteredImages.length;
                    updateCoverflowPosition();
                    if (progressBar) {
                        progressBar.style.transition = 'none';
                        progressBar.style.width = '0%';
                        progressBar.offsetWidth;
                        progressBar.style.transition = `width ${AUTOPLAY_DELAY}ms linear`;
                        progressBar.style.width = '100%';
                    }
                }
            }, AUTOPLAY_DELAY);
        }

        function stopAutoplay() {
            clearInterval(autoplayTimer);
            autoplayTimer = null;
            if (progressBar) {
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }

        function pauseAutoplay(withResume = false) {
            autoplayPaused = true;
            if (progressBar) {
                const current = progressBar.getBoundingClientRect().width;
                const parent = progressBar.parentElement.getBoundingClientRect().width;
                progressBar.style.transition = 'none';
                progressBar.style.width = parent > 0 ? `${(current / parent) * 100}%` : '0%';
            }
            clearTimeout(resumeTimer);
            if (withResume) {
                resumeTimer = setTimeout(() => {
                    autoplayPaused = false;
                    startAutoplay();
                }, RESUME_AFTER);
            }
        }

        function resumeAutoplay() {
            if (!autoplayTimer) return;
            autoplayPaused = false;
            if (progressBar) {
                progressBar.style.transition = `width ${AUTOPLAY_DELAY}ms linear`;
                progressBar.style.width = '100%';
            }
        }

        coverflowStage.addEventListener('mouseenter', () => { clearTimeout(resumeTimer); pauseAutoplay(false); });
        coverflowStage.addEventListener('mouseleave', () => { resumeAutoplay(); });

        let touchStartX = 0;
        coverflowStage.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            pauseAutoplay(true);
        }, { passive: true });

        coverflowStage.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) nextCard();
            if (touchEndX - touchStartX > 40) prevCard();
        }, { passive: true });

        function nextCard() {
            if (filteredImages.length === 0) return;
            activeIndex = (activeIndex + 1) % filteredImages.length;
            updateCoverflowPosition();
        }

        function prevCard() {
            if (filteredImages.length === 0) return;
            activeIndex = (activeIndex - 1 + filteredImages.length) % filteredImages.length;
            updateCoverflowPosition();
        }

        prevCardBtn.addEventListener('click', () => { pauseAutoplay(true); prevCard(); });
        nextCardBtn.addEventListener('click', () => { pauseAutoplay(true); nextCard(); });

        // --- Lightbox Logic ---
        function openLightbox(index) {
            activeIndex = index;
            pauseAutoplay(false);
            updateLightboxImage();
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
                lightbox.classList.add('opacity-100');
                lightboxImg.classList.remove('scale-95');
                lightboxImg.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.remove('scale-100');
            lightboxImg.classList.add('scale-95');

            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
                document.body.style.overflow = '';
                startAutoplay();
            }, 300);
        }

        function updateLightboxImage() {
            lightboxImg.style.opacity = '0';
            setTimeout(() => {
                lightboxImg.src = `media/${filteredImages[activeIndex]}`;
                imageCounter.textContent = `${activeIndex + 1} / ${filteredImages.length}`;
                lightboxImg.style.opacity = '1';
            }, 150);
        }

        function nextLightboxImage() {
            nextCard();
            updateLightboxImage();
        }

        function prevLightboxImage() {
            prevCard();
            updateLightboxImage();
        }

        closeBtn.addEventListener('click', closeLightbox);

        if (modalNextBtn) modalNextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextLightboxImage(); });
        if (modalPrevBtn) modalPrevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevLightboxImage(); });
        if (modalNextBtnMobile) modalNextBtnMobile.addEventListener('click', (e) => { e.stopPropagation(); nextLightboxImage(); });
        if (modalPrevBtnMobile) modalPrevBtnMobile.addEventListener('click', (e) => { e.stopPropagation(); prevLightboxImage(); });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.id === 'lightboxContent') {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextLightboxImage();
                if (e.key === 'ArrowLeft') prevLightboxImage();
            } else {
                if (e.key === 'ArrowRight') nextCard();
                if (e.key === 'ArrowLeft') prevCard();
            }
        });

        window.addEventListener('resize', updateCoverflowPosition);

        const bgVideo = document.getElementById('bgVideo');
        if (bgVideo) bgVideo.playbackRate = 0.5;

        renderCategories();
        initCoverflow();
    </script>
</body>

</html>
